[project]
name = "real-estate-rag"
description = "RAG assistant that answers questions over real estate news articles"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.66.0",
    "trafilatura>=2.3.1",
]


[dependency-groups]
dev = [
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "ragas>=0.3",
]

[tool.ruff.lint]
ignore = ["BLE001", "S110"]


